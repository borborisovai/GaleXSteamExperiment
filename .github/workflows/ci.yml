name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Plugin artifacts present
        run: |
          test -s plugin/.millennium/Dist/index.js
          test -s plugin/.millennium/Dist/webkit.js
          test -s plugin/.millennium/Dist/browser.css

  prepare:
    name: Pinned-source guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest test_prepare -v
        working-directory: backend

  lua:
    name: Lua backend logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - run: luajit -b plugin/backend/main.lua /tmp/main.lua.bc
      - run: luajit scripts/test-backend.lua

  gale:
    name: Headless Gale (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Linux Tauri dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xvfb
      - name: Build frontend + headless Gale (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          scripts/build-plugin.sh
          scripts/build-gale.sh
      - name: Build frontend + headless Gale (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/build-gale.ps1
          npm --prefix frontend ci
          npm --prefix frontend run build:plugin
          npm --prefix frontend run build:webkit
      - name: Headless smoke (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a python3 scripts/smoke-headless.py
      - name: Headless smoke (Windows)
        if: matrix.os == 'windows-latest'
        run: python scripts/smoke-headless.py
      - uses: actions/upload-artifact@v4
        with:
          name: galex-plugin-${{ matrix.os }}
          path: |
            plugin/plugin.json
            plugin/backend/
            plugin/.millennium/Dist/
            plugin/bin/
