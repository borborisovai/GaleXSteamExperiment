name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: galexd (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build
        run: cargo build --manifest-path backend/Cargo.toml --all-targets

      # Advisory: the crate has not been through rustfmt/clippy yet, so these
      # report through annotations instead of failing the build.
      - name: Lint (advisory)
        run: |
          cargo fmt --manifest-path backend/Cargo.toml --all -- --check \
            || echo "::warning title=rustfmt::cargo fmt would reformat the crate"
          cargo clippy --manifest-path backend/Cargo.toml --all-targets \
            || echo "::warning title=clippy::clippy reported findings"

  daemon-smoke:
    name: galexd smoke
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Boot the daemon and probe the API
        run: scripts/smoke-daemon.sh

  frontend:
    name: UI + plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build (web + plugin bundle)
        working-directory: frontend
        run: |
          npm run build
          npm run build:plugin

      - name: Headless UI tests
        working-directory: frontend
        run: |
          node ../devserver/src/server.js --port 7788 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:7788/api/v1/health >/dev/null && break
            sleep 0.25
          done
          npm run smoke
          npm run smoke:interact
          npm run smoke:plugin

      - name: Fixture backend syntax
        run: node --check devserver/src/server.js && node --check devserver/src/data.js
