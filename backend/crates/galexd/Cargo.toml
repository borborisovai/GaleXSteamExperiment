[package]
name = "galexd"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "GaleX bridge — a local HTTP/SSE daemon that exposes Gale's mod-management core to the Steam client"
license = "GPL-3.0"
repository = "https://github.com/borborisovai/GaleXSteamExperiment"

[[bin]]
name = "galexd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
